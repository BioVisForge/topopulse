[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "topopulse"
version = "0.1.0"
description = "Rust-backed dynamic biological network visualization for Python"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Abhinav Mishra"}]
keywords = ["bioinformatics", "network", "animation", "systems-biology", "visualization"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Rust",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]

dependencies = [
  "imageio>=2.36",
  "imageio-ffmpeg>=0.5",
  "matplotlib>=3.9",
  "networkx>=3.3",
  "numpy>=1.26,<2.4",
  "pandas>=2.2",
  "pydantic>=2.8",
  "pyyaml>=6.0",
  "scipy>=1.13",
  "typer>=0.12",
  "xarray>=2024.7",
]

[project.urls]
Homepage = "https://github.com/BioVisForge/topopulse"
Documentation = "https://biovisforge.github.io/topopulse/"
Repository = "https://github.com/BioVisForge/topopulse"
Issues = "https://github.com/BioVisForge/topopulse/issues"

[project.optional-dependencies]
graphml = ["lxml>=5.2"]
docs = ["zensical>=0.0.13"]
benchmark = ["psutil>=6.0"]

[dependency-groups]
dev = [
  "maturin>=1.7,<2",
  "mypy>=1.11",
  "pandas-stubs>=2.2",
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "types-pyyaml>=6.0",
  "types-networkx>=3.3",
]
docs = ["zensical>=0.0.13"]
benchmark = ["psutil>=6.0"]

[project.scripts]
topopulse = "topopulse.cli:app"

[tool.maturin]
manifest-path = "rust/Cargo.toml"
python-source = "src"
module-name = "topopulse._rust"
features = ["pyo3/extension-module"]
strip = true

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
markers = ["ffmpeg: requires FFmpeg", "slow: larger integration test"]

[tool.coverage.run]
branch = true
source = ["topopulse"]
omit = ["*/__main__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "if __name__ == .__main__.:"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["topopulse"]
plugins = ["pydantic.mypy"]
