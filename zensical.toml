[project]
site_url = "https://biovisforge.github.io/topopulse/"
site_name = "TopoPulse"
site_description = "Dynamic biological network visualization"
site_author = "BioVisForge"
copyright = "Copyright &copy; 2026 Abhinav Mishra"
repo_url = "https://github.com/BioVisForge/topopulse"
repo_name = "BioVisForge/topopulse"
edit_uri = "edit/main/docs/"
nav = [
  { "Home" = "index.md" },
  { "Installation" = "installation.md" },
  { "Quickstart" = "quickstart.md" },
  { "Concepts" = "concepts.md" },
  { "Data" = [
    { "Network inputs" = "network-inputs.md" },
    { "Node data" = "node-data.md" },
    { "Edge data" = "edge-data.md" },
  ] },
  { "Visualization" = [
    { "Layouts" = "layouts.md" },
    { "Normalization" = "normalization.md" },
    { "Animations" = "animations.md" },
    { "Differential networks" = "differential-networks.md" },
    { "Perturbations" = "perturbations.md" },
  ] },
  { "Scale" = [
    { "Large networks" = "large-networks.md" },
    { "Performance" = "performance.md" },
  ] },
  { "Reference" = [
    { "Python API" = "python-api.md" },
    { "CLI" = "cli.md" },
    { "Configuration" = "configuration.md" },
    { "Examples" = "examples.md" },
  ] },
  { "Development" = [
    { "Architecture" = "architecture.md" },
    { "Rust backend" = "rust-backend.md" },
    { "Troubleshooting" = "troubleshooting.md" },
    { "FAQ" = "faq.md" },
    { "Contributing" = "contributing.md" },
  ] },
]

[project.theme]
language = "en"
logo = "assets/logo.png"
favicon = "assets/logo.png"
features = ["content.code.copy", "navigation.footer", "navigation.sections", "navigation.top", "search.highlight", "toc.follow"]

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "indigo"
accent = "teal"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "indigo"
accent = "teal"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[project.markdown_extensions]
admonition = {}
attr_list = {}
pymdownx.details = {}
pymdownx.highlight.anchor_linenums = true
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
toc.permalink = true

